<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Name Generator</title><style>
:root{--bg:#07101f;--blue:#5b95ff;--red:#ff7373;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Aptos,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#f8fafc}body{padding:10px;overflow:auto;background:radial-gradient(circle at 10% 0,rgba(21,94,239,.2),transparent 35%),#07101f}button,input,select{font:inherit}.app{width:min(1060px,100%);margin:auto;border:1px solid #293a57;border-radius:18px;background:linear-gradient(145deg,#111c30,#091323);box-shadow:0 24px 80px #0008;overflow:hidden}.header{min-height:68px;padding:10px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid #2a3953}.brand{min-width:0;display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;flex:none}.brand h1{margin:0;font-size:17px}.brand p{margin:2px 0 0;color:#a9b5c6;font-size:10.5px}.actions{display:flex;gap:8px;align-items:center}.tabs{display:flex;padding:3px;border:1px solid #2c3c57;border-radius:10px;background:#0a1425}.tabs button{height:32px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:#9eabbe;font-size:11.5px;font-weight:750;cursor:pointer;transition:.15s}.tabs .active{background:#203657;color:#8ab7ff}.help{width:32px;height:32px;border:1px solid #3b4a65;border-radius:50%;background:#18253c;color:#75a6ff;font-weight:850;cursor:pointer}.content{display:grid;grid-template-columns:minmax(0,1fr) 320px}.form,.preview{padding:16px}.preview{border-left:1px solid #293650;background:#0b1527}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px 12px}.field{grid-column:span 2}.wide{grid-column:span 4}.hidden{display:none!important}.divider{grid-column:1/-1;height:1px;background:#2a3953}.section-label{grid-column:1/-1;color:#8390a5;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:-5px}label{display:flex;align-items:center;gap:4px;margin:0 0 4px;color:#dce3ee;font-size:11px;font-weight:750}.required: height:90px;padding:13px 46px 13px 13px;border:1px solid #2e4166;border-radius:11px;background:#07101f;color:#fff;font:750 12px/1.55 ui-monospace,Consolas;overflow-wrap:anywhere}.copy{position:absolute;right:9px;top:9px;width:31px;height:31px;border:1px solid #8eaee54d;border-radius:8px;background:#5792ff1f;color:#dce9ff;display:grid;place-items:center;cursor:pointer}.preview-actions{display:flex;justify-content:flex-end}.reset{height:31px;padding:0 10px;border:1px solid #35445e;border-radius:8px;background:#16243a;color:#c4cdda;font-size:11px;font-weight:750;cursor:pointer}.pattern{margin-top:12px;padding-top:10px;border-top:1px solid #2a3953}.pattern b{display:block;color:#8390a5;font-size:9px;text-transform:uppercase}.pattern code{color:#aab8cd;font-size:9.5px}
.shade{display:none;position:fixed;inset:0;z-index:900;background:#000b;backdrop-filter:blur(4px)}.shade.open{display:block}.modal{display:none;position:fixed;z-index:901;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 30px));max-height:calc(100vh - 30px);border:1px solid #3a4e6e;border-radius:15px;background:#101b2e;box-shadow:0 30px 100px #000b;overflow:hidden}.modal.open{display:block}.mhead{display:flex;gap:7px;padding:11px;border-bottom:1px solid #2a3953}.mhead button{height:38px;padding:0 10px;border:1px solid #3b4a64;border-radius:8px;background:#182740;color:#b9c4d3;font-size:11px;font-weight:750;cursor:pointer}.mclose{width:38px;font-size:20px!important}.mbody{display:grid;grid-template-columns:180px 1fr;height:min(350px,calc(100vh - 130px))}.cats{padding:8px;border-right:1px solid #2a3953;background:#0b1527;overflow:auto}.cat{width:100%;padding:9px;border:0;border-radius:8px;background:transparent;color:#95a3b7;text-align:left;font-size:11px;font-weight:750;cursor:pointer;transition:.15s}.cat.active{background:#173865;color:#8db8ff}.opts{padding:8px;overflow:auto}.opt{display:grid;grid-template-columns:62px 1fr;padding:10px;border-radius:8px;cursor:pointer}.opt:hover{background:#182b47}.code{color:#70a4ff;font-weight:850}.optname{font-size:12px}

.spot{display:none;position:fixed;z-index:970;border-radius:12px;border:2px solid #79a9ff;box-shadow:0 0 0 9999px rgba(3,8,18,.72);pointer-events:none;transition:left .25s cubic-bezier(.4,0,.2,1),top .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1),height .25s cubic-bezier(.4,0,.2,1)}.spot.open{display:block}.tour{display:none;position:fixed;z-index:990;opacity:0;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:16px;border:1px solid #426087;border-radius:13px;background:#14233b;box-shadow:0 24px 80px #000b;transition:left .25s cubic-bezier(.4,0,.2,1),top .25s cubic-bezier(.4,0,.2,1),opacity .2s ease}.tour.open{display:block;opacity:1}.tour small{color:#79a9ff;font-size:9px;font-weight:850}.tour h2{font-size:16px;margin:5px 0}.tour p{color:#b4c0d0;font-size:11.5px}.tour-actions{display:flex;justify-content:space-between;margin-top:6px}.tour-actions button{border:0;background:transparent;color:#b8c3d2;font-size:11px;font-weight:750;cursor:pointer}.tour-actions .next{padding:7px 12px;border-radius:7px;background:#496fe7;color:#fff}.toast{position:fixed;right:14px;bottom:14px;z-index:1700;padding:8px 10px;border-radius:8px;background:#eef4ff;color:#17315c;font-size:11px;opacity:0;transition:.18s}.toast.show{opacity:1}

</style></head><body>
<main class="app"><header class="header"><div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="11" fill="#101c30" stroke="#2f4568"/><path d="M14 11h8l5 5v13a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2Z" fill="none" stroke="#5b95ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M22 11v5h5" fill="none" stroke="#5b95ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 22h8M16 26h5" stroke="#8ab7ff" stroke-width="1.8" stroke-linecap="round"/></svg><div><h1>File Name Generator</h1><p>Generate consistent, standardized file names.</p></div></div><div class="actions"><div id="scope" class="tabs"><button class="active" data-mode="client">Client</button><button data-mode="academy">Academy</button></div><button id="help" class="help">?</button></div></header>
<div class="content"><section id="details" class="form"><div class="grid"><div class="field client"><label class="required">Client <button class="info">i<span>Enter the official client name or approved abbreviation, for example FAHR.</span></button></label><input id="client" placeholder="FAHR"></div><div class="field client"><label class="required">Program / Product <button class="info">i<span>Use the approved program or product name.</span></button></label><input id="program" placeholder="AI Workforce Program"></div><div class="field"><label class="required">Deliverable Type <button class="info">i<span>Browse by category or search by code or deliverable name.</span></button></label><button id="typeTrigger" class="trigger"><span id="typeLabel">Select Deliverable Type</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button><input id="typeCode" type="hidden"></div><div class="field wide"><label>Short Description <button class="info">i<span>Optional. Add a concise topic, audience, or delivery descriptor.</span></button></label><input id="desc" placeholder="Leadership-Training"></div><div class="field"><label>Language <button class="info">i<span>Optional. Select English, Arabic, or leave blank.</span></button></label><select id="lang"><option value="">No Language</option><option value="EN">EN - English</option><option value="AR">AR - Arabic</option></select></div><div class="field"><label class="required">Revision <button class="info">i<span>Use numbers and one decimal point, for example 1.0.</span></button></label><div class="revision"><span class="prefix">Rev</span><input id="rev" placeholder="0.0" inputmode="decimal"></div></div><div class="field"><label>Date <button class="info">i<span>Optional. Select Today or choose a date from the calendar.</span></button></label><div class="date-actions"><button id="today" class="datebtn">Today</button><button id="calBtn" class="datebtn icon" aria-label="Open calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button><input id="date" type="hidden"></div></div><div class="divider"></div><div class="section-label">Optional Review Information</div><div class="field"><label>Reviewer Initials <button class="info">i<span>Use only for a temporary review copy.</span></button></label><input id="reviewer" maxlength="5" placeholder="Optional"></div></div></section>
<aside id="preview" class="preview"><span class="preview-label">Generated File Name</span><div class="namebox"><div id="filename" class="filename">Your file name will appear here</div><button id="copy" class="copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div><div class="preview-actions"><button id="reset" class="reset">Reset</button></div><div class="pattern"><b>Pattern</b><code id="pattern">[Client]-[Program/Product]-[Type]-[Short Description]-[Language]-[Date]-Rev[Revision]</code></div></aside></div></main>
<div id="shade" class="shade"></div><section id="typeModal" class="modal"><div class="mhead"><input id="search" placeholder="Search Code or Deliverable Type"><button id="clearType">Clear</button><button id="closeType" class="mclose">&times;</button></div><div class="mbody"><nav id="cats" class="cats"></nav><div id="opts" class="opts"></div></div></section>
<div id="calendar" class="calendar"><div class="calhead"><button id="prevM">&lsaquo;</button><strong id="month"></strong><button id="nextM">&rsaquo;</button><button id="clearDate">Clear</button><button id="closeCal">&times;</button></div><div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="days" class="days"></div></div>
<div id="tip" class="tip"></div><div id="spot" class="spot"></div><section id="tour" class="tour"><small id="step"></small><h2 id="tourTitle"></h2><p id="tourText"></p><div class="tour-actions"><button id="tourClose">Close</button><button id="tourNext" class="next">Next</button></div></section><div id="toast" class="toast">File name copied</div>
<script>
const TYPES=[['Training & Enablement','TRN','Training Presentation'],['Training & Enablement','TRNP','Training Plan'],['Training & Enablement','FG','Facilitator Guide'],['Training & Enablement','PG','Participant Guide'],['Training & Enablement','CUR','Curriculum'],['Training & Enablement','ASM','Assessment'],['Training & Enablement','CERT','Certificate'],['Training & Enablement','ATT','Attendance Record'],['Training & Enablement','RPT','Report'],['Training & Enablement','VID','Video'],['Training & Enablement','SCR','Script'],['Governance','POL','Policy'],['Governance','PRO','Process'],['Governance','STRTG','Strategy'],['Governance','FRM','Framework'],['Governance','GL','Guideline'],['Governance','STD','Standard'],['Governance','DOC','General Document'],['Governance','TMPL','Template'],['Governance','FORM','Form'],['Governance','CHK','Checklist'],['Documentation','MAN','User or Admin Guide'],['Documentation','QRG','Quick Reference Guide'],['Documentation','FAQ','Frequently Asked Questions'],['Documentation','RN','Release Notes'],['Documentation','TS','Technical Specification'],['Documentation','DEP','Deployment Guide'],['Documentation','CFG','Configuration Guide'],['Documentation','API','API Documentation'],['Documentation','SOP','Task-Specific Standard Operating Procedure']];
const ORDER=['Training & Enablement','Governance','Documentation'];const $=x=>document.getElementById(x);let cat='Training & Enablement',mode='client',started=false,view=new Date();
function clean(v,u){let s=(v||'').trim().replace(/[\\/:*?"<>|\[\]&,.$#@!%()+={};']/g,' ').replace(/[_\s]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');return u?s.toUpperCase():s.split('-').filter(Boolean).map(x=>/^[A-Z0-9]{2,12}$/.test(x)?x:x[0].toUpperCase()+x.slice(1).toLowerCase()).join('-')}
/* Deliverable type modal */
function renderCats(){$('cats').innerHTML=ORDER.map(x=>`<button class="cat ${x===cat?'active':''}" data-c="${x}">${x}</button>`).join('');[...document.querySelectorAll('.cat')].forEach(b=>b.onclick=()=>{cat=b.dataset.c;$('search').value='';renderCats();renderOpts()})}
function renderOpts(){let q=$('search').value.trim().toLowerCase(),rows=TYPES.filter(x=>q?(x[1]+' '+x[2]).toLowerCase().includes(q):x[0]===cat);$('opts').innerHTML=rows.length?rows.map(x=>`<div class="opt" data-code="${x[1]}" data-name="${x[2]}"><span class="code">${x[1]}</span><span class="optname">${x[2]}</span></div>`).join(''):'<div class="optname" style="padding:20px;color:#8996aa">No matching deliverable type</div>';[...document.querySelectorAll('.opt')].forEach(o=>o.onclick=()=>{$('typeCode').value=o.dataset.code;$('typeLabel').textContent=o.dataset.code+' - '+o.dataset.name;$('typeTrigger').classList.add('selected');started=true;hideTypes();build()})}
function showTypes(){$('search').value='';renderCats();renderOpts();$('shade').classList.add('open');$('typeModal').classList.add('open');setTimeout(()=>$('search').focus(),0)}
function hideTypes(){$('shade').classList.remove('open');$('typeModal').classList.remove('open')}
$('typeTrigger').onclick=showTypes;$('shade').onclick=hideTypes;$('closeType').onclick=hideTypes;$('clearType').onclick=()=>{$('typeCode').value='';$('typeLabel').textContent='Select Deliverable Type';$('typeTrigger').classList.remove('selected');build()};$('search').oninput=renderOpts;
/* Calendar */
function iso(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function todayIso(){return iso(new Date())}
function drawCal(){$('month').textContent=new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(view);let y=view.getFullYear(),m=view.getMonth(),start=new Date(y,m,1-new Date(y,m,1).getDay()),h='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let v=iso(d);h+=`<button class="day ${d.getMonth()!==m?'muted':''} ${v===todayIso()?'today':''} ${v===$('date').value?'selected':''}" data-v="${v}">${d.getDate()}</button>`}$('days').innerHTML=h;[...document.querySelectorAll('.day')].forEach(b=>b.onclick=()=>{$('date').value=b.dataset.v;syncToday();hideCal();build()})}
function placeCal(){let r=$('calBtn').getBoundingClientRect(),c=$('calendar'),w=c.offsetWidth,hgt=c.offsetHeight,left=Math.min(innerWidth-w-8,Math.max(8,r.right-w)),top=r.bottom+7;if(top+hgt>innerHeight-8)top=Math.max(8,r.top-hgt-7);c.style.left=left+'px';c.style.top=top+'px'}
function showCal(){view=$('date').value?new Date($('date').value+'T00:00:00'):new Date();drawCal();const c=$('calendar');c.style.visibility='hidden';c.classList.add('open');requestAnimationFrame(()=>{placeCal();c.style.visibility=''})}
function hideCal(){$('calendar').classList.remove('open')}
function syncToday(){$('today').classList.toggle('active',$('date').value===todayIso())}
$('calBtn').onclick=()=>{$('calendar').classList.contains('open')?hideCal():showCal()};$('closeCal').onclick=hideCal;$('clearDate').onclick=()=>{$('date').value='';syncToday();hideCal();build()};$('prevM').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);drawCal()};$('nextM').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);drawCal()};$('today').onclick=()=>{$('date').value=$('date').value===todayIso()?'':todayIso();syncToday();build()};
document.addEventListener('click',e=>{if($('calendar').classList.contains('open')&&!e.target.closest('#calendar')&&!e.target.closest('#calBtn'))hideCal()});window.addEventListener('resize',()=>{if($('calendar').classList.contains('open'))placeCal()});window.addEventListener('scroll',()=>{if($('calendar').classList.contains('open'))placeCal()},{passive:true});
/* Build */
function flag(e,b){e.classList.toggle('missing',started&&b)}
function build(){let p=[];if(mode==='client'){let c=clean($('client').value,true),pr=clean($('program').value);if(c)p.push(c);if(pr)p.push(pr);flag($('client'),!c);flag($('program'),!pr)}else{p.push('PRE','GTAEO');$('client').classList.remove('missing');$('program').classList.remove('missing')}if($('typeCode').value)p.push($('typeCode').value);flag($('typeTrigger'),!$('typeCode').value);let d=clean($('desc').value);if(d)p.push(d);if($('lang').value)p.push($('lang').value);if($('date').value)p.push($('date').value.replaceAll('-',''));if($('rev').value)p.push('Rev'+$('rev').value);flag($('rev'),!$('rev').value||!/^\d+\.\d+$/.test($('rev').value));let r=clean($('reviewer').value,true);if(r)p.push(r);$('filename').textContent=p.join('-')||'Your file name will appear here'}
['client','program','desc','lang','reviewer'].forEach(id=>$(id).oninput=()=>{started=true;build()});$('rev').oninput=e=>{started=true;let v=e.target.value.replace(/[^0-9.]/g,''),i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');e.target.value=v;build()};
[...document.querySelectorAll('.tabs button')].forEach(b=>b.onclick=()=>{mode=b.dataset.mode;started=true;[...document.querySelectorAll('.tabs button')].forEach(x=>x.classList.toggle('active',x===b));[...document.querySelectorAll('.client')].forEach(x=>x.classList.toggle('hidden',mode!=='client'));$('pattern').textContent=mode==='client'?'[Client]-[Program/Product]-[Type]-[Short Description]-[Language]-[Date]-Rev[Revision]':'PRE-GTAEO-[Type]-[Short Description]-[Language]-[Date]-Rev[Revision]';build()});
$('reset').onclick=()=>{['client','program','desc','rev','date','reviewer'].forEach(x=>$(x).value='');$('lang').value='';$('typeCode').value='';$('typeLabel').textContent='Select Deliverable Type';$('typeTrigger').classList.remove('selected');started=false;syncToday();[...document.querySelectorAll('.missing')].forEach(x=>x.classList.remove('missing'));build()};
$('copy').onclick=async()=>{let v=$('filename').textContent==='Your file name will appear here'?'':$('filename').textContent;try{await navigator.clipboard.writeText(v)}catch(e){let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1000)};
/* Tooltip */
function showTip(b){let t=$('tip');t.textContent=b.querySelector('span').textContent;t.classList.add('open');requestAnimationFrame(()=>{let r=b.getBoundingClientRect(),p=t.getBoundingClientRect(),l=Math.min(innerWidth-p.width-10,Math.max(10,r.left+r.width/2-p.width/2)),top=r.bottom+8;if(top+p.height>innerHeight-10)top=Math.max(10,r.top-p.height-8);t.style.left=l+'px';t.style.top=top+'px'})}
[...document.querySelectorAll('.info')].forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=()=>$('tip').classList.remove('open');b.onfocus=()=>showTip(b);b.onblur=()=>$('tip').classList.remove('open')});
/* Tour: spotlight cut-out + card anchored beside the target (works in tall and short views) */
const TOUR=[['scope','1 of 3','Choose the Scope','Select Client or Academy.'],['details','2 of 3','Enter the Details','Choose a deliverable type and complete the fields that apply.'],['preview','3 of 3','Copy the Result','Review the generated name and select the copy icon.']];let ti=0;
function targetRect(){return $(TOUR[ti][0]).getBoundingClientRect()}
function moveSpot(){let r=targetRect(),pad=6,left=Math.max(4,r.left-pad),top=Math.max(4,r.top-pad),w=Math.min(innerWidth-left-4,r.width+pad*2),h=Math.min(innerHeight-top-4,r.height+pad*2);$('spot').style.left=left+'px';$('spot').style.top=top+'px';$('spot').style.width=Math.max(0,w)+'px';$('spot').style.height=Math.max(0,h)+'px'}
function placeCard(){let r=targetRect(),card=$('tour'),cw=card.offsetWidth,ch=card.offsetHeight,gap=14,m=10,top,left;
 let below=innerHeight-r.bottom-gap, above=r.top-gap;
 if(below>=ch+m){top=r.bottom+gap;} else if(above>=ch+m){top=r.top-ch-gap;} else {top=Math.max(m,Math.min(innerHeight-ch-m,r.top+r.height/2-ch/2));}
 left=r.left+r.width/2-cw/2; left=Math.max(m,Math.min(innerWidth-cw-m,left));
 top=Math.max(m,Math.min(innerHeight-ch-m,top));
 card.style.left=left+'px';card.style.top=top+'px'}
function reposition(){moveSpot();placeCard()}
function paintTour(){let s=TOUR[ti];$('step').textContent='Step '+s[1];$('tourTitle').textContent=s[2];$('tourText').textContent=s[3];$('tourNext').textContent=ti===2?'Done':'Next';let el=$(s[0]);try{el.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(e){el.scrollIntoView()}reposition();setTimeout(reposition,250);setTimeout(reposition,460)}
function openTour(){ti=0;$('spot').classList.add('open');$('tour').classList.add('open');paintTour()}
function closeTour(){$('spot').classList.remove('open');$('tour').classList.remove('open')}
$('help').onclick=openTour;$('tourClose').onclick=closeTour;$('tourNext').onclick=()=>{ti<2?(ti++,paintTour()):closeTour()};
window.addEventListener('resize',()=>{if($('tour').classList.contains('open'))reposition()});window.addEventListener('scroll',()=>{if($('tour').classList.contains('open'))reposition()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTypes();hideCal();closeTour()}});
renderCats();renderOpts();syncToday();build();
</script></body></html>
