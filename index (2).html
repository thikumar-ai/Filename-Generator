<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTAEO File Name Generator</title><style>
:root{--b:#155eef;--v:#6941c6;--i:#172033;--m:#667085;--l:#d9e0ea;--red:#d92d20}*{box-sizing:border-box}html,body{height:100%}body{margin:0;padding:14px;display:grid;place-items:center;background:radial-gradient(circle at 8% 0,#eaf2ff,transparent 32%),radial-gradient(circle at 100% 100%,#f1ebff,transparent 35%),#f5f7fb;font:13px Aptos,"Segoe UI",Arial;color:var(--i)}button,input,select{font:inherit}.app{width:min(1040px,100%);background:#fffffff2;border:1px solid #fff;border-radius:18px;box-shadow:0 24px 70px #10182821}.head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}h1{font-size:20px;margin:0 0 3px}.sub{margin:0;color:var(--m);font-size:12px}.tools{display:flex;gap:9px;align-items:center}.help{width:30px;height:30px;border:1px solid var(--l);border-radius:50%;background:#fff;color:var(--b);font-weight:900;cursor:pointer}.modes{display:flex;padding:4px;background:#eef1f6;border-radius:9px}.modes button{border:0;background:transparent;padding:8px 11px;border-radius:7px;color:var(--m);font-size:12px;font-weight:750;cursor:pointer}.modes .active{background:#fff;color:var(--b);box-shadow:0 2px 8px #1018281a}.main{display:grid;grid-template-columns:1fr 330px}.form{padding:17px 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.span2{grid-column:span 2}.review-details{grid-column:1/-1;border-top:1px solid var(--l);padding-top:9px}.review-details summary{cursor:pointer;color:#475467;font-size:11.5px;font-weight:750;list-style:none}.review-details summary::-webkit-details-marker{display:none}.review-details summary:after{content:"+";float:right;color:var(--b);font-size:17px}.review-details[open] summary:after{content:"−"}.review-field{margin-top:9px;max-width:220px}.hidden{display:none}label{display:block;margin:0 0 5px;font-size:11.5px;font-weight:750}.req:after{content:" *";color:var(--red)}input,select{width:100%;height:39px;border:1px solid #cfd6e1;border-radius:9px;padding:8px 10px;background:#fff;outline:0;transition:.15s}input:focus,select:focus{border-color:#84adff;box-shadow:0 0 0 3px #155eef1a}.missing{border-color:#fda29b!important;background:#fffafa!important;box-shadow:0 0 0 3px #f0443812!important}select:invalid{color:#98a2b3}.rev{position:relative}.rev b{position:absolute;left:10px;top:11px;color:#475467}.rev input{padding-left:35px}.typebox{position:relative}.list{display:none;position:absolute;z-index:30;top:44px;inset-inline:0;max-height:200px;overflow:auto;background:#fff;border:1px solid var(--l);border-radius:10px;box-shadow:0 16px 40px #1018282e;padding:5px}.list.open{display:block}.group{padding:7px 8px 3px;font-size:9.5px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#98a2b3}.opt{padding:8px;border-radius:7px;cursor:pointer}.opt:hover{background:#eef4ff}.code{display:inline-block;min-width:44px;color:var(--b);font-weight:850}.info{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;padding:0;margin-left:3px;border:1px solid #b8c1cf;border-radius:50%;background:#fff;color:var(--m);font-size:10px;font-weight:850;cursor:help}.info span{position:absolute;z-index:50;left:50%;bottom:24px;width:210px;padding:9px;border-radius:8px;background:#101828;color:#fff;font-size:11px;font-weight:500;line-height:1.4;text-align:left;opacity:0;visibility:hidden;transform:translate(-50%,4px);transition:.15s;pointer-events:none}.info:hover span,.info:focus span{opacity:1;visibility:visible;transform:translate(-50%,0)}.preview{padding:17px;border-left:1px solid var(--l);background:linear-gradient(#fbfcff,#f8f9fc);border-radius:0 0 18px}.preview small{color:var(--m);font-size:10px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.namebox{position:relative;margin:8px 0 11px}.name{display:flex;align-items:center;min-height:92px;padding:14px 48px 14px 14px;border-radius:11px;background:#101828;color:#fff;font:750 13px/1.55 ui-monospace,Consolas;overflow-wrap:anywhere}.copyicon{position:absolute;right:10px;top:10px;width:32px;height:32px;border:1px solid #ffffff2e;border-radius:8px;background:#ffffff14;color:#fff;display:grid;place-items:center;cursor:pointer;transition:.15s}.copyicon:hover{background:#ffffff26;transform:translateY(-1px)}.copyicon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}.reset{height:34px;border:1px solid #cfd6e1;border-radius:8px;background:#fff;color:#475467;padding:0 11px;font-size:11.5px;font-weight:750;cursor:pointer}.shade{display:none;position:fixed;inset:0;z-index:80;background:#10182833;pointer-events:none}.shade.open{display:block}.bubble{display:none;position:fixed;z-index:100;width:min(330px,calc(100vw - 28px));padding:16px;background:#fff;border-radius:14px;box-shadow:0 22px 65px #10182847}.bubble.open{display:block}.bubble em{font-size:10px;font-style:normal;font-weight:850;color:var(--b);text-transform:uppercase}.bubble h2{font-size:17px;margin:5px 0}.bubble p{font-size:12.5px;line-height:1.5;color:#475467}.touract{display:flex;justify-content:space-between;align-items:center}.touract button{border:0;background:transparent;font-weight:750;cursor:pointer}.touract .next{background:linear-gradient(135deg,var(--b),var(--v));color:#fff;padding:8px 12px;border-radius:8px}.hl{position:relative;z-index:90!important;border-radius:11px;box-shadow:0 0 0 4px #fff,0 0 0 8px #155eefbf,0 14px 40px #1018283d!important}.toast{position:fixed;right:18px;bottom:18px;padding:9px 12px;border-radius:9px;background:#101828;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:800px){body{display:block}.main{grid-template-columns:1fr}.preview{border-left:0;border-top:1px solid var(--l)}.grid{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}.review-details{grid-column:1/-1;border-top:1px solid var(--l);padding-top:9px}.review-details summary{cursor:pointer;color:#475467;font-size:11.5px;font-weight:750;list-style:none}.review-details summary::-webkit-details-marker{display:none}.review-details summary:after{content:"+";float:right;color:var(--b);font-size:17px}.review-details[open] summary:after{content:"−"}.review-field{margin-top:9px;max-width:220px}}@media(max-width:520px){.head{align-items:flex-start;gap:10px}.tools{flex-direction:column-reverse}.grid{grid-template-columns:1fr}.span2{grid-column:auto}}
.date-actions{display:flex;gap:7px;align-items:center;position:relative}.date-btn{height:39px;border:1px solid #cfd6e1;border-radius:9px;background:#fff;color:#344054;padding:0 13px;font-size:12px;font-weight:750;cursor:pointer}.date-btn:hover{border-color:#84adff;background:#f8faff}.date-btn.selected{border-color:#84adff;background:#eef4ff;color:var(--b)}.icon-date{width:42px;padding:0;display:grid;place-items:center}.icon-date svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}.native-date{position:absolute;width:42px;right:0;opacity:0;pointer-events:none}.review-separator{grid-column:1/-1;height:1px;background:var(--l);margin:1px 0 0}
</style></head><body><main class="app"><header class="head"><div><h1>GTAEO File Name Generator</h1><p class="sub">Create a consistent file name in a few steps.</p></div><div class="tools"><button id="help" class="help" aria-label="Start guided tour">?</button><div id="modes" class="modes"><button class="active" data-mode="client">Client</button><button data-mode="internal">Internal / Presight</button></div></div></header><div class="main"><section id="details" class="form"><div class="grid">
<div class="client"><label class="req">Client <button class="info">i<span>Official client name or approved abbreviation, for example ADAA.</span></button></label><input id="client" data-required placeholder="ADAA"></div>
<div class="client"><label class="req">Product / project <button class="info">i<span>Approved product or project name, for example Al Mersad.</span></button></label><input id="product" data-required placeholder="Al Mersad"></div>
<div class="typebox"><label class="req">Document type <button class="info">i<span>Search by code or name, then select the closest deliverable type.</span></button></label><input id="typeSearch" data-required placeholder="Search document type" autocomplete="off"><input id="typeCode" type="hidden"><div id="list" class="list"></div></div>
<div class="span2"><label>Short description <button class="info">i<span>Concise subject that distinguishes the file without repeating the document type.</span></button></label><input id="desc" placeholder="User Guide"></div>
<div><label class="req">Language <button class="info">i<span>Select EN for English or AR for Arabic.</span></button></label><select id="lang" data-required><option value="" selected disabled>Select language</option><option value="EN">EN - English</option><option value="AR">AR - Arabic</option></select></div>
<div><label class="req">Revision <button class="info">i<span>Numbers and one decimal point only, for example 0.0 or 1.2.</span></button></label><div class="rev"><b>Rev</b><input id="rev" data-required placeholder="0.0" inputmode="decimal"></div></div>

<div><label>Date <button class="info">i<span>Optional. Select Today or choose a date from the calendar.</span></button></label><div class="date-actions"><button id="todayBtn" class="date-btn" type="button">Today</button><button id="calendarBtn" class="date-btn icon-date" type="button" aria-label="Choose date" title="Choose date"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg></button><input id="date" class="native-date" type="date" aria-label="Select date"></div></div>
<div class="review-separator"></div><div><label>Reviewer initials <button class="info">i<span>Optional. Use only for a temporary review copy, for example TK.</span></button></label><input id="reviewer" maxlength="5" placeholder="Optional"></div>
</div></section><aside id="preview" class="preview"><small>Generated file name</small><div class="namebox"><div id="name" class="name">Your file name will appear here</div><button id="copy" class="copyicon" title="Copy file name" aria-label="Copy generated file name"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button></div><button id="reset" class="reset">Reset</button></aside></div></main><div id="shade" class="shade"></div><div id="bubble" class="bubble"><em id="step"></em><h2 id="tourTitle"></h2><p id="tourText"></p><div class="touract"><button id="close">Close</button><button id="next" class="next">Next</button></div></div><div id="toast" class="toast">File name copied</div>
<script>
const T=[['Documentation','MAN','Manual or guide'],['Documentation','QRG','Quick reference guide'],['Documentation','FAQ','Frequently asked questions'],['Documentation','RN','Release notes'],['Documentation','TS','Technical specification'],['Documentation','DEP','Deployment guide'],['Documentation','CFG','Configuration guide'],['Documentation','API','API documentation'],['Documentation','SOP','Task-specific SOP'],['Documentation','VID','Video'],['Documentation','SCR','Script'],['Training and Enablement','TRN','Training presentation'],['Training and Enablement','TRNP','Training plan'],['Training and Enablement','FG','Facilitator guide'],['Training and Enablement','PG','Participant guide'],['Training and Enablement','CUR','Curriculum'],['Training and Enablement','ASM','Assessment'],['Training and Enablement','CERT','Certificate'],['Training and Enablement','ATT','Attendance record'],['Training and Enablement','RPT','Report'],['Governance','POL','Policy'],['Governance','PRO','Procedure or process'],['Governance','WI','Work instruction'],['Governance','STRTG','Strategy'],['Governance','FRM','Framework'],['Governance','GL','Guideline'],['Governance','STD','Standard'],['Governance','DOC','General document'],['Governance','TMPL','Template'],['Governance','FORM','Form'],['Governance','CHK','Checklist']];const $=x=>document.getElementById(x);let mode='client',started=false;
function clean(v,u=false){let s=(v||'').trim().replace(/[\\/:*?"<>|\[\]&,.$#@!%()+={};']/g,' ').replace(/[_\s]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');if(u)return s.toUpperCase();return s.split('-').filter(Boolean).map(x=>/^[A-Z0-9]{2,8}$/.test(x)?x:x[0].toUpperCase()+x.slice(1).toLowerCase()).join('-')}
function render(q=''){q=q.toLowerCase().trim();let h='',g='';T.filter(x=>!q||(`${x[0]} ${x[1]} ${x[2]}`).toLowerCase().includes(q)).forEach(x=>{if(g!==x[0]){g=x[0];h+=`<div class="group">${g}</div>`}h+=`<div class="opt" data-c="${x[1]}" data-n="${x[2]}"><span class="code">${x[1]}</span>${x[2]}</div>`});$('list').innerHTML=h||'<div class="opt">No matching type</div>';document.querySelectorAll('.opt[data-c]').forEach(o=>o.onclick=()=>{$('typeCode').value=o.dataset.c;$('typeSearch').value=`${o.dataset.c} - ${o.dataset.n}`;$('list').classList.remove('open');started=true;build()})}
function flag(id,missing){$(id).classList.toggle('missing',started&&missing)}
function build(){let p=[];if(mode==='client'){let c=clean($('client').value,true),pr=clean($('product').value);if(c)p.push(c);if(pr)p.push(pr);flag('client',!c);flag('product',!pr)}else{p.push('PRE','GTAEO');$('client').classList.remove('missing');$('product').classList.remove('missing')}let t=$('typeCode').value;if(t)p.push(t);flag('typeSearch',!t);let d=clean($('desc').value);if(d)p.push(d);$('desc').classList.remove('missing');if($('date').value)p.push($('date').value.replaceAll('-',''));if($('lang').value)p.push($('lang').value);flag('lang',!$('lang').value);let r=$('rev').value.trim();if(r)p.push('Rev'+r);flag('rev',!r||!/^\d+\.\d+$/.test(r));let rv=clean($('reviewer').value,true);if(rv)p.push(rv);let cand=p.join('-');$('name').textContent=cand||'Your file name will appear here'}
$('typeSearch').onfocus=()=>{render($('typeSearch').value.includes('—')?'':$('typeSearch').value);$('list').classList.add('open')};$('typeSearch').oninput=e=>{started=true;if(e.target.value.includes('—'))$('typeCode').value='';render(e.target.value);$('list').classList.add('open');build()};document.onclick=e=>{if(!e.target.closest('.typebox'))$('list').classList.remove('open')};document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{started=true;mode=b.dataset.mode;document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.client').forEach(x=>x.classList.toggle('hidden',mode!=='client'));build()});['client','product','desc','lang','date','reviewer'].forEach(id=>{$(id).oninput=()=>{started=true;build()};$(id).onchange=()=>{started=true;build()}});$('rev').oninput=e=>{started=true;let v=e.target.value.replace(/[^0-9.]/g,''),i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');e.target.value=v;build()};function localDateValue(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
$('todayBtn').onclick=()=>{started=true;$('date').value=localDateValue();$('todayBtn').classList.add('selected');build()};$('calendarBtn').onclick=()=>{if($('date').showPicker)$('date').showPicker();else $('date').click()};$('date').onchange=()=>{started=true;$('todayBtn').classList.toggle('selected',$('date').value===localDateValue());build()};
$('reset').onclick=()=>{['client','product','typeSearch','typeCode','desc','rev','date','reviewer'].forEach(x=>$(x).value='');$('lang').value='';started=false;$('todayBtn').classList.remove('selected');document.querySelectorAll('.missing').forEach(x=>x.classList.remove('missing'));build()};$('copy').onclick=async()=>{let text=$('name').textContent;if(text==='Your file name will appear here')text='';try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1100)};
const S=[['modes','1 of 3','Choose a category','Select Client or Internal / Presight.'],['details','2 of 3','Enter the details','Complete the applicable fields. Reviewer initials are optional and separated from the main naming fields.'],['preview','3 of 3','Review and copy','Select the copy icon beside the generated file name.']];let si=0;function pos(t){let b=$('bubble'),r=t.getBoundingClientRect(),top=r.bottom+12;if(top+b.offsetHeight>innerHeight-12)top=Math.max(12,r.top-b.offsetHeight-12);b.style.left=Math.max(12,Math.min(innerWidth-b.offsetWidth-12,r.left))+'px';b.style.top=top+'px'}function paint(){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));let s=S[si],t=$(s[0]);t.classList.add('hl');$('step').textContent='Step '+s[1];$('tourTitle').textContent=s[2];$('tourText').textContent=s[3];$('next').textContent=si===2?'Done':'Next';requestAnimationFrame(()=>pos(t))}function openTour(){si=0;$('shade').classList.add('open');$('bubble').classList.add('open');paint()}function closeTour(){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));$('shade').classList.remove('open');$('bubble').classList.remove('open')}$('help').onclick=openTour;$('close').onclick=closeTour;$('next').onclick=()=>{si<2?(si++,paint()):closeTour()};build();
</script></body></html>
